name: Nightly Docker Build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Nightly/dev image: built from the BS `dev` branch, tagged `nightly`.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/blessing-skin-server
            ${{ secrets.DOCKERHUB_USERNAME }}/blessing-skin-server
          tags: |
            type=raw,value=nightly

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push nightly
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDPLATFORM=linux/amd64
            BLESSING_SOURCE=git
            BLESSING_VERSION=dev
