name: Release Docker Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Blessing Skin release tag (e.g., v6.0.2)'
        required: true
        type: string
  repository_dispatch:
    types: [release]
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  # Stable image: built from the BS release archive, tagged `latest` + version.
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/blessing-skin-server
            ${{ secrets.DOCKERHUB_USERNAME }}/blessing-skin-server
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag || github.event.client_payload.tag || github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push release
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDPLATFORM=linux/amd64
            PHP_VERSION=8.1
            BLESSING_SOURCE=release
            BLESSING_VERSION=${{ steps.meta.outputs.version }}