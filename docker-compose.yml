services:
  blessing-skin:
    image: ghcr.io/snowmoonss/blessing-skin-server:nightly
    container_name: blessing-skin-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - APP_URL=https://skin.example.com      # ← 改成你的站点地址
      - APP_DEBUG=false
      # ---- 数据库（MariaDB/MySQL）----
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb                        # 容器网络内的 MariaDB 服务名
      - DB_PORT=3306
      - DB_DATABASE=blessingskin
      - DB_USERNAME=blessingskin
      - DB_PASSWORD=blessingskin
      - DB_PREFIX=
      # ---- Redis（缓存 / 会话 / 队列）----
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis                       # 容器网络内的 Redis 服务名
      - REDIS_PORT=6379
      - REDIS_PASSWORD=blessingskin
    ports:
      - "80:80"
    volumes:
      - ./config:/config   # .env 等配置
      - ./data:/data       # storage / 插件等数据
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    environment:
      - MARIADB_ROOT_PASSWORD=blessingskin
      - MARIADB_DATABASE=blessingskin
      - MARIADB_USER=blessingskin
      - MARIADB_PASSWORD=blessingskin
    volumes:
      - ./mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass blessingskin
    environment:
      - REDIS_PASSWORD=blessingskin
    volumes:
      - ./redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Janus — Yggdrasil Connect 服务端
  janus:
    image: ghcr.io/snowmoonss/janus:nightly
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - PORT=3000
      # ---- 数据库（与 Blessing Skin 共享同一个 MariaDB）----
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USERNAME=blessingskin
      - DB_PASSWORD=blessingskin
      - DB_NAME=blessingskin
      # - DB_PREFIX=bs_                        # 若皮肤站配置了表前缀则打开
      # ---- OpenID 提供者标识符 & 皮肤站地址（必须 HTTPS、不得以 / 结尾）----
      - ISSUER=https://auth.example.com        # ← 改成你的 Janus 对外地址
      - BS_SITE_URL=https://skin.example.com   # ← 改成你的皮肤站地址
      - SHARED_CLIENT_ID=
    ports:
      - "3000:3000"
    volumes:
      - ./janus-config:/config
      - ./data:/server-storage:ro     # 读取 Blessing Skin 的 oauth-private.key
      - ./janus-data:/data            # 数据库备份目录
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
